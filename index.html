<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xem bản đồ nhà</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif}
  #info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.78);padding:10px 14px;font-size:14px;line-height:1.7;border:1px solid #522;max-width:350px}
  #info b.c{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle}
  #mode,#fl{color:#ffd700;font-weight:700}
  kbd{background:#333;border:1px solid #666;border-radius:3px;padding:0 5px;font-size:12px}
  #err{display:none;position:fixed;left:0;right:0;bottom:0;background:#b00;color:#fff;padding:10px 14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="info">
  <div>Chế độ: <span id="mode"></span> (<kbd>V</kbd> đổi) &nbsp; Đang xem: <span id="fl"></span></div>
  <div><kbd>1</kbd> tầng trệt &nbsp; <kbd>2</kbd> tầng lầu &nbsp; <kbd>3</kbd> cả hai &nbsp; <kbd>L</kbd> tên phòng</div>
  <div><b class="c" style="background:#ffd700"></b>Chìa khóa (phòng kho) &nbsp; <b class="c" style="background:#33ff66"></b>Pin (4)</div>
  <div><b class="c" style="background:#8b4513"></b>Cửa chính (thoát hiểm) &nbsp; <b class="c" style="background:#ff9933"></b>Cầu thang xoắn</div>
  <hr>
  <div id="help"></div>
  <div><kbd>F</kbd> sáng / tối</div>
</div>
<div id="err"></div>

<script>
const $ = id => document.getElementById(id);
try {
// =====================================================
//  BẢN ĐỒ NHÀ KIỂU PHƯƠNG TÂY - đơn vị mét
//  x chạy sang phải (đông), z chạy xuống (nam). Nhà rộng 36 x dài 26.
//  Cửa chính ở tường phía nam (z = 26), giữa nhà.
// =====================================================
const WT = 0.3, WH = 3.0, FLOOR2 = 3.2, DOOR_H = 2.4;
const W = 36, D = 26;

// Phòng: [tên, x1, z1, x2, z2, màu sàn]
const ROOMS_G = [  // tầng trệt
  ['HÀNH LANG 1',  0,  0, 36,  6, 0x555555],
  ['PHÒNG KHÁCH',  0,  6, 12, 26, 0x6b3a2a],
  ['SẢNH',        12,  6, 24, 26, 0x3a5a3a],
  ['PHÒNG KHO',   24,  6, 36, 26, 0x8a7a4a],
];
const ROOMS_U = [  // tầng lầu
  ['PHÒNG NGỦ',        0,  0, 18,  6, 0x2f4a6b],
  ['PHÒNG LÀM VIỆC',  18,  0, 36,  6, 0x5a4a6b],
  ['HÀNH LANG 2',      0,  6, 36, 10, 0x666666],
  ['PHÒNG TẮM',        0, 10, 12, 26, 0x4a6a6a],
  ['THƯ VIỆN',        24, 10, 36, 26, 0x6b5a3a],
];

// Tường: [hướng, từ, đến, vị trí cố định, [cửa [bắt đầu, kết thúc]]]  ('x' = chạy ngang, 'z' = chạy dọc; cửa xếp từ nhỏ đến lớn)
const WALLS_GROUND = [
  ['x', 0, 36,  0, []],
  ['x', 0, 36, 26, [[16.5, 19.5]]],          // tường nam: chừa chỗ cho cửa chính
  ['z', 0, 26,  0, []], ['z', 0, 26, 36, []],
  ['x', 0, 36,  6, [[4, 7], [14, 22], [29, 32]]], // hành lang 1 -> khách | sảnh (cổng vòm) | kho
  ['z', 6, 26, 12, [[18, 21]]],              // khách <-> sảnh
  ['z', 6, 26, 24, [[18, 21]]],              // sảnh <-> kho
];
const WALLS_UPPER = [
  ['x', 0, 36,  0, []], ['x', 0, 36, 26, []],
  ['z', 0, 26,  0, []], ['z', 0, 26, 36, []],
  ['x', 0, 36,  6, [[8, 11], [25, 28]]],     // hành lang 2 -> phòng ngủ | phòng làm việc
  ['z', 0,  6, 18, []],                      // ngăn phòng ngủ / phòng làm việc
  ['x', 0, 12, 10, [[3, 6]]],                // hành lang 2 -> phòng tắm
  ['x', 24, 36, 10, [[30, 33]]],             // hành lang 2 -> thư viện
  ['z', 10, 26, 12, []], ['z', 10, 26, 24, []],
];

// CẦU THANG XOẮN: tâm (x,z), bán kính ngoài R, bán kính trụ r0, số bậc, số vòng quay
// Đỉnh thang quay về hướng BẮC rồi bước ra "cầu nối" tới sàn lầu.
const SP = { x: 18, z: 14, R: 3.0, r0: .45, n: 24, turns: 1.25 };
const HOLE_R = 3.4;                            // bán kính lỗ trên sàn lầu

const KEY_POS  = [30, 14];                     // chìa khóa (phòng kho)
const BAT_POS  = [[6, 16, 0], [18, 3, 0], [30, 22, 0], [6, 3, FLOOR2]]; // [x, z, độ cao sàn]
const EXIT_POS = [18, 26];                     // cửa chính
// =====================================================
//  HẾT PHẦN BẢN ĐỒ
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const amb = new THREE.AmbientLight(0xffffff, 0.85); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(20, 60, 10); scene.add(sun);

const G = new THREE.Group(), U = new THREE.Group(), B = new THREE.Group(); // tầng trệt, tầng lầu, chung
scene.add(G, U, B);
const MAT = (c, r = .9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const WALL = MAT(0x7a6a5e), RAILMAT = MAT(0xaa8844, .6);

function box(p, x, y, z, w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); p.add(m); return m;
}
function wall(p, [axis, a, b, f, doors], y0) {
  const segs = []; let pos = a;
  doors.forEach(([s, e]) => { if (s > pos) segs.push([pos, s]); pos = e; });
  if (pos < b) segs.push([pos, b]);
  const put = (s, e, yy, hh) => axis === 'x'
    ? box(p, (s + e) / 2, yy, f, e - s, hh, WT, WALL)
    : box(p, f, yy, (s + e) / 2, WT, hh, e - s, WALL);
  segs.forEach(([s, e]) => put(s, e, y0 + WH / 2, WH));
  doors.forEach(([s, e]) => put(s, e, y0 + DOOR_H + (WH - DOOR_H) / 2, WH - DOOR_H));
}
function label(p, text, x, y, z, w = 7) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 0, 320, 64);
  g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText(text, 160, 43);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(w, w / 5, 1); s.position.set(x, y, z); s.userData.label = true; p.add(s);
}

// Sàn từng phòng + tên + tường
const rooms = (p, list, y0) => list.forEach(([n, x1, z1, x2, z2, col]) => {
  box(p, (x1 + x2) / 2, y0 + .02, (z1 + z2) / 2, x2 - x1, .04, z2 - z1, MAT(col, 1));
  label(p, n, (x1 + x2) / 2, y0 + 2.4, (z1 + z2) / 2);
});
rooms(G, ROOMS_G, 0); WALLS_GROUND.forEach(w => wall(G, w, 0));
rooms(U, ROOMS_U, FLOOR2); WALLS_UPPER.forEach(w => wall(U, w, FLOOR2));
label(U, 'SẢNH LẦU', 18, FLOOR2 + 2.4, 21);

// Sàn tầng lầu có LỖ TRÒN cho cầu thang xoắn
const sh = new THREE.Shape();
sh.moveTo(0, 0); sh.lineTo(W, 0); sh.lineTo(W, D); sh.lineTo(0, D); sh.closePath();
const hole = new THREE.Path(); hole.absarc(SP.x, SP.z, HOLE_R, 0, Math.PI * 2, true); sh.holes.push(hole);
const slabGeo = new THREE.ExtrudeGeometry(sh, { depth: .2, bevelEnabled: false }); slabGeo.rotateX(Math.PI / 2);
const slab = new THREE.Mesh(slabGeo, MAT(0x4a4038, 1)); slab.position.y = FLOOR2; U.add(slab);

// Cầu nối: từ đỉnh thang (hướng bắc) tới sàn lầu
box(U, SP.x, FLOOR2 - .1, SP.z - 3.2, 1.8, .2, .9, MAT(0x4a4038, 1));

// Lan can tròn quanh lỗ, chừa khe ở hướng bắc (chỗ cầu nối)
const GAP = .5, NORTH = -Math.PI / 2;
const ringGeo = new THREE.TorusGeometry(HOLE_R - .05, .04, 6, 64, Math.PI * 2 - 2 * GAP); ringGeo.rotateX(Math.PI / 2);
const ring = new THREE.Mesh(ringGeo, RAILMAT); ring.position.set(SP.x, FLOOR2 + 1, SP.z); ring.rotation.y = Math.PI / 2 - GAP; U.add(ring);
for (let k = 0; k < 24; k++) {
  const a = k * Math.PI * 2 / 24, d = Math.abs(Math.atan2(Math.sin(a - NORTH), Math.cos(a - NORTH)));
  if (d < GAP + .05) continue;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 1, 6), RAILMAT);
  post.position.set(SP.x + (HOLE_R - .05) * Math.cos(a), FLOOR2 + .5, SP.z + (HOLE_R - .05) * Math.sin(a)); U.add(post);
}

// CẦU THANG XOẮN
const dth = SP.turns * Math.PI * 2 / SP.n, rise = FLOOR2 / SP.n;
const th = i => NORTH - (SP.n - i) * dth;       // bậc cuối (i = n) hướng bắc
const STEP = MAT(0xff9933, .7), rm = (SP.R + SP.r0) / 2;
const pts = [];
for (let i = 1; i <= SP.n; i++) {
  const a = th(i), tread = box(B, SP.x + rm * Math.cos(a), i * rise - .07, SP.z + rm * Math.sin(a), SP.R - SP.r0, .14, rm * dth * 1.15, STEP);
  tread.rotation.y = -a;                         // xoay bậc theo hướng tỏa ra từ tâm
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .9, 5), RAILMAT);
  post.position.set(SP.x + (SP.R - .06) * Math.cos(a), i * rise + .45, SP.z + (SP.R - .06) * Math.sin(a)); B.add(post);
}
for (let i = 0; i <= SP.n; i++) { const a = th(i); pts.push(new THREE.Vector3(SP.x + (SP.R - .06) * Math.cos(a), i * rise + .95, SP.z + (SP.R - .06) * Math.sin(a))); }
B.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, .04, 6), RAILMAT)); // tay vịn xoắn
const newel = new THREE.Mesh(new THREE.CylinderGeometry(SP.r0, SP.r0, FLOOR2 + .9, 16), MAT(0x8a6a3a)); // trụ giữa
newel.position.set(SP.x, (FLOOR2 + .9) / 2, SP.z); B.add(newel);
label(B, 'CẦU THANG XOẮN', SP.x, FLOOR2 + 1.8, SP.z, 4.2);

// Cửa chính (thoát hiểm), chìa khóa, pin
box(G, EXIT_POS[0], DOOR_H / 2, EXIT_POS[1], 3, DOOR_H, .25, MAT(0x8b4513));
const key = new THREE.Mesh(new THREE.TorusGeometry(.4, .12, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
key.position.set(KEY_POS[0], 1, KEY_POS[1]); key.rotation.x = Math.PI / 2; G.add(key);
BAT_POS.forEach(([x, z, y]) => box(y ? U : G, x, y + .6, z, .5, .8, .5, new THREE.MeshBasicMaterial({ color: 0x33ff66 })));

function showFloors(n) { G.visible = n !== 2; U.visible = n !== 1; $('fl').innerText = ['', 'TẦNG TRỆT', 'TẦNG LẦU', 'CẢ HAI'][n]; }
showFloors(1);
let labelsOn = true;

// =====================================================
//  CAMERA: nhìn từ trên xuống  /  bay tự do
// =====================================================
const keys = {}; let tx = 18, tz = 13, h = 55, bright = true;
let mode = 'top', yaw = 0, pitch = -0.9, speed = 10, drag = false;
const fpos = new THREE.Vector3(), dom = renderer.domElement;
const HELP = {
  top: '<kbd>W A S D</kbd> kéo bản đồ &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> phóng to / thu nhỏ',
  fly: '<kbd>Bấm vào màn hình</kbd> khóa chuột (<kbd>Esc</kbd> nhả) hoặc giữ chuột để xoay<br>' +
       '<kbd>W A S D</kbd> bay &nbsp; <kbd>Space</kbd> lên &nbsp; <kbd>Shift</kbd> xuống &nbsp; <kbd>Z</kbd>/<kbd>X</kbd> chậm / nhanh<br>' +
       '<kbd>T</kbd> hành lang 1 &nbsp; <kbd>H</kbd> cửa chính nhìn vào sảnh &nbsp; <kbd>G</kbd> sảnh lầu nhìn xuống thang &nbsp; <kbd>Y</kbd> hành lang 2'
};
function setMode(m) {
  mode = m;
  if (m === 'fly') { camera.up.set(0, 1, 0); camera.fov = 70; camera.rotation.order = 'YXZ'; fpos.set(tx, 28, tz + 20); yaw = 0; pitch = -0.9; }
  else { camera.up.set(0, 0, -1); camera.fov = 50; if (document.pointerLockElement) document.exitPointerLock(); }
  camera.updateProjectionMatrix();
  $('mode').innerText = m === 'fly' ? 'BAY TỰ DO' : 'NHÌN TỪ TRÊN';
  $('help').innerHTML = HELP[m];
}
setMode('top');

dom.addEventListener('click', () => { if (mode === 'fly' && !document.pointerLockElement) dom.requestPointerLock(); });
dom.addEventListener('mousedown', () => drag = true);
addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => {
  if (mode !== 'fly' || !(document.pointerLockElement === dom || drag)) return;
  yaw -= e.movementX * .003; pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * .003));
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') setMode(mode === 'top' ? 'fly' : 'top');
  if (e.code === 'Digit1') showFloors(1);
  if (e.code === 'Digit2') showFloors(2);
  if (e.code === 'Digit3') showFloors(3);
  if (e.code === 'KeyL') { labelsOn = !labelsOn; scene.traverse(o => { if (o.userData.label) o.visible = labelsOn; }); }
  if (e.code === 'KeyF') { bright = !bright; amb.intensity = bright ? .85 : .15; sun.intensity = bright ? .6 : 0; scene.background.set(bright ? 0x101010 : 0x030000); }
  if (mode === 'fly') {
    if (e.code === 'KeyT') { fpos.set(2, 1.6, 3); yaw = -Math.PI / 2; pitch = 0; showFloors(1); }
    if (e.code === 'KeyH') { fpos.set(18, 1.6, 24.5); yaw = 0; pitch = .15; showFloors(3); }
    if (e.code === 'KeyG') { fpos.set(18, FLOOR2 + 1.6, 23); yaw = 0; pitch = -.35; showFloors(3); }
    if (e.code === 'KeyY') { fpos.set(2, FLOOR2 + 1.6, 8); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyZ') speed = Math.max(2, speed / 1.4);
    if (e.code === 'KeyX') speed = Math.min(80, speed * 1.4);
    if (e.code === 'Space') e.preventDefault();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if (mode === 'top') {
    const s = h * .012;
    if (keys.KeyW) tz -= s; if (keys.KeyS) tz += s;
    if (keys.KeyA) tx -= s; if (keys.KeyD) tx += s;
    if (keys.KeyQ) h = Math.max(8, h - .8); if (keys.KeyE) h = Math.min(160, h + .8);
    camera.position.set(tx, h, tz); camera.lookAt(tx, 0, tz);
  } else {
    const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const u = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
    fpos.x += (-sy * cp * f + cy * r) * speed * dt;
    fpos.y += (sp * f + u) * speed * dt;
    fpos.z += (-cy * cp * f - sy * r) * speed * dt;
    fpos.y = Math.max(.3, fpos.y);
    camera.position.copy(fpos); camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
})();
} catch (e) {
  const el = $('err'); el.innerText = 'Lỗi: ' + e.message; el.style.display = 'block';
}
</script>
</body>
</html>
