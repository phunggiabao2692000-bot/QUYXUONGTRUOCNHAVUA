    if (e.code === 'KeyG') { fpos.set(CX, F2 + 1.6, HZ - 2.5); yaw = Math.PI; pitch = -0.35; showFloors(3); }
    if (e.code === 'KeyY') { fpos.set(2, F2 + 1.6, CZ2); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyO') { fpos.set(12.5, F2 + 1.6, T2 + 2); yaw = Math.PI / 2 + 0.35; pitch = -0.1; showFloors(2); }
    if (e.code === 'KeyJ') { fpos.set(70.5, F2 + 1.6, KS + 2); yaw = 2.5; pitch = -0.1; showFloors(2); }
    if (e.code === 'KeyU') { fpos.set(56, F2 + 1.6, 6 - EU); yaw = -Math.PI / 2; pitch = 0; showFloors(2); }
    if (e.code === 'KeyP') { fpos.set(11, F2 + 3.8, 21.5); yaw = 2.45; pitch = -0.1; showFloors(2); }
    if (e.code === 'KeyZ') speed = Math.max(2, speed / 1.4);
    if (e.code === 'KeyX') speed = Math.min(120, speed * 1.4);
  }
  if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
});
addEventListener('keyup', function (e) { keys[e.code] = false; });

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05); tt += dt;
  pend.rotation.z = Math.sin(tt * 3) * 0.28;            // quả lắc đồng hồ
  chand.rotation.y += dt * 0.08;                        // đèn chùm lớn xoay nhẹ
  FANS.forEach(function (f) { f.rotation.y += dt * 5; });   // cánh quạt trần quay
  smallCh.forEach(function (c, i) { c.rotation.y += dt * (i % 2 ? 0.2 : -0.2); });   // 4 đèn nhỏ xoay ngược chiều nhau
  if (bright && !underground) LT.forEach(function (o) { if (o.flick && Math.random() < 0.1) o.l.intensity = o.base * (0.65 + Math.random() * 0.5); });
  DOORS.forEach(function (d) {   // cánh cửa xoay mở / đóng
    const g = d.open ? 1 : 0; d.t += Math.sign(g - d.t) * Math.min(Math.abs(g - d.t), dt * 3);
    d.hg.rotation.y = d.cR + (d.oR - d.cR) * d.t; d.rect.dead = d.t > 0.5;
  });
  if (FR) { FR.t += Math.sign((FR.open ? 1 : 0) - FR.t) * Math.min(Math.abs((FR.open ? 1 : 0) - FR.t), dt * 2); FR.hg.rotation.y = 1.7 * FR.t; }
  if (CAR) { CAR.ht += Math.sign((CAR.hoodOpen ? 1 : 0) - CAR.ht) * Math.min(Math.abs((CAR.hoodOpen ? 1 : 0) - CAR.ht), dt * 1.5); CAR.hood.rotation.x = 1.05 * CAR.ht; }
  HATCH.t += Math.sign((HATCH.open ? 1 : 0) - HATCH.t) * Math.min(Math.abs((HATCH.open ? 1 : 0) - HATCH.t), dt * 1.5); HATCH.lid.rotation.x = -1.5 * HATCH.t;
  if (underground) TLIGHTS.forEach(function (l) { if (Math.random() < 0.18) l.intensity = l.userData.base * (0.05 + Math.random() * 1.2); });
  if (mode === 'top') {
    const s = h * 0.012;
    if (keys.KeyW) tz -= s; if (keys.KeyS) tz += s;
    if (keys.KeyA) tx -= s; if (keys.KeyD) tx += s;
    if (keys.KeyQ) h = Math.max(8, h - 1); if (keys.KeyE) h = Math.min(260, h + 1);
    camera.position.set(tx, h, tz); camera.lookAt(tx, 0, tz); torch.visible = false; syncGranny(false);
  } else {
    yaw += ((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 2.2 * dt;
    pitch = Math.max(-1.5, Math.min(1.5, pitch + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 1.6 * dt));
    if (mode === 'walk') {
      if (story === 'wake') { wakeFrame(dt); torch.visible = false; }
      else if (story !== 'play') { camera.position.set(13, F2 + 1.35, -3.0); camera.rotation.set(1.38, Math.PI, 0); torch.visible = false; }
      else {
        playFrame(dt);
        torch.visible = torchOn && charge > 0 && !hidden;
        torch.intensity = charge < 15 ? 2.2 * (0.35 + Math.random() * 0.65) : 2.2;
        if (!jump) camY += ((hidden ? hs.base + EYE - 0.6 : PL.y + EYE) - camY) * Math.min(1, dt * 14);
        if (hidden) camera.position.set(hs.cx, camY, hs.cz); else camera.position.set(PL.x, camY + Math.sin(bob) * 0.06, PL.z);
        const wob = dizzy > 0 ? Math.min(1, dizzy) : 0;
        camera.rotation.set(pitch, yaw, Math.sin(tt * 1.7) * 0.11 * wob + (shake > 0 ? (Math.random() - 0.5) * 0.06 * shake : 0));
        const tg = pickTarget();
        if (bloodSeen && !doorMsg && tg && (tg.type === 'dr' || tg.type === 'door')) { doorMsg = true; think('CHẢ LẼ MÌNH BỊ BÓC CẮT???'); }
        msgT -= dt;
        if (msgT <= 0 && !escaped && !over) { const m = $('msg'); if (tg) { m.textContent = tg.label; m.style.display = 'block'; } else m.style.display = 'none'; }
        hudT -= dt; if (hudT <= 0) { hudT = 0.5; hud(); }
        const gl = $('glitch'), gt = dizzy > 0 ? 0.6 : (underground ? 0.16 : 0); if (gl._o !== gt) { gl.style.opacity = gt; gl._o = gt; }
        const fl = dizzy > 0 ? 'blur(1.5px) saturate(0.7)' : ''; if (dom._f !== fl) { dom.style.filter = fl; dom._f = fl; }
        if (underground) { dust.position.set(camera.position.x, camera.position.y, camera.position.z); dust.rotation.y += dt * 0.05; }
      }
      syncGranny(story === 'play' && GR.path && GR.pi < GR.path.length);
    } else {
      torch.visible = false; syncGranny(false);
      const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
      const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      const u = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
      fpos.x += (-sy * cp * f + cy * r) * speed * dt;
      fpos.y += (sp * f + u) * speed * dt;
      fpos.z += (-cy * cp * f - sy * r) * speed * dt;
      fpos.y = Math.max(0.3, fpos.y);
      camera.position.copy(fpos); camera.rotation.set(pitch, yaw, 0);
    }
  }
  renderer.render(scene, camera);
})();
}
</script>
