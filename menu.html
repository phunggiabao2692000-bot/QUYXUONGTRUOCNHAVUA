<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granny - Horror Game</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --blood: #a00000;
  --red: #e00000;
  --white: #e8e8e8;
}

body {
  margin: 0;
  overflow: hidden;
  background: #000;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font-family: inherit;
  cursor: pointer;
  color: white;
  background: transparent;
  border: none;
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 5px;
}

#scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 35%,
      #242020 0%, #100f0f 35%, #020202 75%);
}

.wall {
  position: absolute;
  inset: 0;
  opacity: .35;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 95px,
      #252222 97px,
      transparent 100px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 100px,
      #171515 102px,
      transparent 104px
    );
}

.spotlight {
  position: absolute;
  width: min(75vw, 800px);
  height: min(100vh, 900px);
  top: -8%;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(
    ellipse at 50% 37%,
    rgba(255, 238, 195, .23),
    rgba(180, 165, 130, .09) 30%,
    transparent 68%
  );
  pointer-events: none;
  animation: lightFlicker 7s infinite;
}

@keyframes lightFlicker {
  0%, 91%, 94%, 100% { opacity: 1; }
  92% { opacity: .65; }
  93% { opacity: .9; }
  95% { opacity: .72; }
}

.lamp {
  position: absolute;
  top: 4%;
  left: 50%;
  width: 8px;
  height: 8px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #fff5cf;
  box-shadow: 0 0 15px 6px #fff1c0,
              0 0 70px 28px rgba(255, 220, 140, .22);
}

.stairs {
  position: absolute;
  width: min(80vw, 720px);
  height: 60%;
  left: 50%;
  bottom: -5%;
  transform: translateX(-50%);
  perspective: 600px;
  opacity: .9;
}

.step {
  position: absolute;
  left: 50%;
  width: 100%;
  height: 10%;
  transform: translateX(-50%);
  background: linear-gradient(#34302d, #151312 45%, #050505);
  border-top: 2px solid #49413a;
  box-shadow: 0 -4px 12px #000;
}

.step:nth-child(1) { bottom: 0; width: 100%; }
.step:nth-child(2) { bottom: 10%; width: 90%; }
.step:nth-child(3) { bottom: 20%; width: 80%; }
.step:nth-child(4) { bottom: 30%; width: 70%; }
.step:nth-child(5) { bottom: 40%; width: 60%; }
.step:nth-child(6) { bottom: 50%; width: 50%; }
.step:nth-child(7) { bottom: 60%; width: 40%; }
.step:nth-child(8) { bottom: 70%; width: 30%; }
.step:nth-child(9) { bottom: 80%; width: 20%; }

.railing {
  position: absolute;
  bottom: 12%;
  height: 55%;
  width: 7px;
  background: linear-gradient(90deg, #080808, #39322b, #050505);
  transform: rotate(23deg);
  opacity: .7;
}

.railing.left { left: 8%; }
.railing.right { right: 8%; transform: rotate(-23deg); }

#grannyWrap {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 15%;
  width: min(42vw, 360px);
  height: min(63vh, 500px);
  transform: translateX(-50%);
  transform-origin: 50% 70%;
  animation: backflip 7s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(0,0,0,.9));
}

@keyframes backflip {
  0%, 16%, 100% { transform: translateX(-50%) rotate(0deg); }
  22% { transform: translateX(-50%) rotate(-20deg); }
  30% { transform: translateX(-50%) rotate(-180deg); }
  38% { transform: translateX(-50%) rotate(-360deg); }
  45%, 65% { transform: translateX(-50%) rotate(-360deg); }
  72% { transform: translateX(-50%) rotate(-340deg); }
  80% { transform: translateX(-50%) rotate(-360deg); }
}

#granny {
  width: 100%;
  height: 100%;
  overflow: visible;
}

#head {
  transform-box: fill-box;
  transform-origin: center;
  animation: lookAround 4s ease-in-out infinite alternate;
}

@keyframes lookAround {
  0%, 15% { transform: rotate(-12deg) translateX(-3px); }
  45% { transform: rotate(15deg) translateX(5px); }
  75% { transform: rotate(-18deg) translateX(-4px); }
  100% { transform: rotate(8deg); }
}

.grannyShadow {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 64%;
  width: min(35vw, 290px);
  height: 40px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #000;
  filter: blur(18px);
  opacity: .9;
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 15%,
    rgba(0,0,0,.35) 55%,
    #000 100%
  );
}

#menu {
  position: absolute;
  z-index: 10;
  left: 50%;
  bottom: 5%;
  transform: translateX(-50%);
  width: min(92vw, 500px);
  text-align: center;
}

.logo {
  margin: 0 0 12px;
  font-size: clamp(32px, 6vw, 64px);
  letter-spacing: 8px;
  color: #d4d0ca;
  text-shadow: 0 3px 5px #000, 0 0 25px #000;
}

.menuButton {
  display: block;
  width: 100%;
  padding: 8px 12px;
  margin: 5px 0;
  font-size: clamp(19px, 3vw, 27px);
  font-weight: bold;
  letter-spacing: 5px;
  color: #eee;
  text-shadow: 0 2px 5px #000;
  transition: .2s;
}

.menuButton:hover {
  color: #ff2222;
  transform: scale(1.06);
  text-shadow: 0 0 14px #a00000;
}

#play {
  color: #e00000;
  font-size: clamp(28px, 5vw, 43px);
  letter-spacing: 9px;
  text-shadow: 0 2px #280000, 0 0 14px #580000;
}

#play:hover {
  color: #ff2424;
  text-shadow: 0 0 25px red;
}

#language {
  position: absolute;
  z-index: 12;
  right: 18px;
  top: 15px;
  font-size: 12px;
  color: #aaa;
  border: 1px solid #444;
  padding: 8px 10px;
}

.panel {
  display: none;
  position: fixed;
  z-index: 30;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(5px);
}

.panel.open {
  display: flex;
}

.panelBox {
  width: min(92vw, 460px);
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  border: 1px solid #61534a;
  background: rgba(8,7,7,.94);
  box-shadow: 0 0 35px #000;
  text-align: center;
}

.panelBox h2 {
  margin: 0 0 24px;
  font-size: 30px;
  letter-spacing: 5px;
  color: #ddd;
}

.panelBox p {
  line-height: 1.7;
}

.modeButton {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 15px;
  border: 1px solid #51413a;
  background: rgba(35,25,25,.65);
  font-size: 21px;
  letter-spacing: 4px;
  transition: .2s;
}

.modeButton:hover {
  border-color: #a00000;
  color: #ff2222;
  background: rgba(80,0,0,.25);
}

.backButton {
  margin-top: 16px;
  padding: 10px 25px;
  border: 1px solid #555;
  color: #aaa;
  letter-spacing: 3px;
}

.backButton:hover {
  color: white;
  border-color: white;
}

.settingRow {
  margin: 22px 0;
  text-align: left;
}

.settingTitle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 17px;
  letter-spacing: 3px;
}

.settingTitle b {
  color: #b7b7b7;
  font-size: 13px;
  letter-spacing: 1px;
}

input[type="range"] {
  width: 100%;
  accent-color: #a00000;
  cursor: pointer;
}

.settingNote {
  padding: 13px;
  border: 1px solid #292323;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: 1px;
}

#warningTitle {
  color: #df0000;
  font-size: 28px;
  text-shadow: 0 0 14px #590000;
}

.warningText {
  color: #ddd;
  font-weight: bold;
  letter-spacing: 1px;
}

#loading {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #aaa;
  letter-spacing: 3px;
}

#loading.open {
  display: flex;
}

.loadingContent {
  padding: 25px;
}

.loadingContent p {
  color: #a00000;
}

@media (max-height: 650px) {
  #grannyWrap {
    top: 7%;
    height: 52vh;
  }

  #menu {
    bottom: 2%;
  }

  .logo {
    font-size: 30px;
    margin-bottom: 4px;
  }

  .menuButton {
    padding: 4px;
    margin: 2px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #grannyWrap,
  #head,
  .spotlight {
    animation-duration: 12s;
  }
}
</style>
</head>

<body>

<div id="scene">
  <div class="wall"></div>
  <div class="spotlight"></div>
  <div class="lamp"></div>

  <div class="stairs">
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="railing left"></div>
    <div class="railing right"></div>
  </div>

  <div class="grannyShadow"></div>

  <div id="grannyWrap">
    <svg id="granny" viewBox="0 0 300 440"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <linearGradient id="dress" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3b3935"/>
          <stop offset=".45" stop-color="#77716a"/>
          <stop offset="1" stop-color="#242321"/>
        </linearGradient>

        <radialGradient id="skin">
          <stop offset="0" stop-color="#d5c6ad"/>
          <stop offset="1" stop-color="#777062"/>
        </radialGradient>

        <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d9d3c5"/>
          <stop offset="1" stop-color="#77736a"/>
        </linearGradient>
      </defs>

      <!-- Arms -->
      <path d="M112 160 Q75 177 68 230 L48 285
               Q43 300 55 304 Q68 307 75 290
               L106 235 L137 193 Z"
            fill="url(#skin)" stroke="#34312d" stroke-width="4"/>

      <path d="M188 160 Q225 177 232 230 L252 285
               Q257 300 245 304 Q232 307 225 290
               L194 235 L163 193 Z"
            fill="url(#skin)" stroke="#34312d" stroke-width="4"/>

      <!-- Dress -->
      <path d="M112 155 Q150 140 188 155
               L211 248 L236 370
               Q150 397 64 370 L89 248 Z"
            fill="url(#dress)" stroke="#171615" stroke-width="6"/>

      <path d="M112 180 L128 365 M150 165 L150 375 M188 180 L173 365"
            fill="none" stroke="#171615" stroke-width="4" opacity=".65"/>

      <!-- Neck -->
      <path d="M130 125 L130 160 Q150 177 170 160 L170 125 Z"
            fill="url(#skin)"/>

      <!-- Hair behind head -->
      <path d="M100 53 Q95 15 150 15
               Q210 10 204 72 L194 132
               L105 132 Z"
            fill="url(#hair)" stroke="#37342e" stroke-width="4"/>

      <!-- Head -->
      <g id="head">
        <path d="M111 47 Q150 26 189 47
                 L185 103 Q178 136 150 145
                 Q121 136 115 103 Z"
              fill="url(#skin)" stroke="#454039" stroke-width="4"/>

        <!-- Hairline -->
        <path d="M108 65 Q104 28 150 29
                 Q197 27 193 65
                 L176 52 L161 62 L143 48 L126 64 Z"
              fill="url(#hair)" stroke="#555047" stroke-width="3"/>

        <!-- Eyes -->
        <ellipse cx="134" cy="84" rx="10" ry="7" fill="#e4dfd2"/>
        <ellipse cx="166" cy="84" rx="10" ry="7" fill="#e4dfd2"/>
        <ellipse cx="136" cy="85" rx="4" ry="6" fill="#850000"/>
        <ellipse cx="164" cy="85" rx="4" ry="6" fill="#850000"/>
        <circle cx="137" cy="84" r="2" fill="#050505"/>
        <circle cx="163" cy="84" r="2" fill="#050505"/>

        <!-- Eyebrows -->
        <path d="M121 73 L143 70 M157 70 L180 73"
              stroke="#37332c" stroke-width="5" stroke-linecap="round"/>

        <!-- Nose -->
        <path d="M149 83 L142 104 L154 105"
              fill="none" stroke="#5c5145" stroke-width="3"/>

        <!-- Mouth -->
        <path d="M131 119 Q150 107 169 119 Q151 137 131 119"
              fill="#210707" stroke="#514039" stroke-width="3"/>
        <path d="M137 117 L164 117"
              stroke="#d9d1c4" stroke-width="4"/>

        <!-- Hair sides -->
        <path d="M113 45 Q95 66 108 123 L120 135 L117 82 Z"
              fill="url(#hair)"/>
        <path d="M188 45 Q205 65 192 123 L180 135 L184 82 Z"
              fill="url(#hair)"/>

        <!-- Wrinkles -->
        <path d="M121 96 L131 99 M169 99 L180 96
                 M133 128 L145 131 M155 131 L167 128"
              stroke="#6b5e50" stroke-width="2" fill="none"/>
      </g>

      <!-- Hands -->
      <path d="M47 281 L39 296 L48 306 L61 300 L62 287 Z"
            fill="url(#skin)"/>
      <path d="M253 281 L261 296 L252 306 L239 300 L238 287 Z"
            fill="url(#skin)"/>

      <!-- Dress hem -->
      <path d="M64 370 Q150 388 236 370 L239 384
               Q150 405 61 384 Z"
            fill="#282622" stroke="#111" stroke-width="4"/>

    </svg>
  </div>

  <div class="vignette"></div>
</div>

<button id="language">VI / EN</button>

<div id="menu">
  <h1 class="logo">GRANNY</h1>
  <button class="menuButton" id="play">PLAY</button>
  <button class="menuButton" id="settingsButton">SETTINGS</button>
</div>

<!-- MODE PANEL -->
<div class="panel" id="modePanel">
  <div class="panelBox">
    <h2>SELECT MODE</h2>
    <button class="modeButton" id="normalButton">NORMAL</button>
    <button class="modeButton" id="nightmareButton">NIGHTMARE</button>
    <button class="backButton" data-close="modePanel">BACK</button>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div class="panel" id="settingsPanel">
  <div class="panelBox">
    <h2>SETTINGS</h2>

    <div class="settingRow">
      <div class="settingTitle">
        <span>VOLUME</span>
        <b id="volumeValue">100%</b>
      </div>

      <input
        type="range"
        id="volumeSlider"
        min="0"
        max="100"
        step="1"
        value="100"
        aria-label="Volume"
      >
    </div>

    <div class="settingRow">
      <div class="settingTitle">
        <span>GRAPHICS</span>
        <b>DEFAULT</b>
      </div>

      <div class="settingNote">
        GRAPHICS SETTINGS UNAVAILABLE<br>
        GAME USES DEFAULT GRAPHICS
      </div>
    </div>

    <button class="backButton" data-close="settingsPanel">BACK</button>
  </div>
</div>

<!-- NIGHTMARE WARNING -->
<div class="panel" id="warningPanel">
  <div class="panelBox">
    <h2 id="warningTitle">WARNING!</h2>

    <p class="warningText">GRANNY ĐI NHANH HƠN!!!</p>
    <p class="warningText">PIN HẾT NHANH HƠN</p>
    <p class="warningText">GRANNY ONE HIT ONE KILL!!!</p>

    <button class="modeButton" id="continueNightmare">
      CONTINUE
    </button>

    <button class="backButton" data-close="warningPanel">
      BACK
    </button>
  </div>
</div>

<div id="loading">
  <div class="loadingContent">
    <h2>GRANNY</h2>
    <p>ENTERING THE HOUSE...</p>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let currentLanguage = "en";
let audioContext = null;
let masterGain = null;
let audioStarted = false;

function openPanel(id) {
  $(id).classList.add("open");
}

function closePanel(id) {
  $(id).classList.remove("open");
}

function closeAllPanels() {
  document.querySelectorAll(".panel").forEach(panel => {
    panel.classList.remove("open");
  });
}

/* VOLUME */

const volumeSlider = $("volumeSlider");
const volumeValue = $("volumeValue");

function loadVolume() {
  let volume = 100;

  try {
    const saved = localStorage.getItem("gh_volume");
    if (saved !== null) {
      volume = Math.max(0, Math.min(100, Number(saved)));
    }
  } catch (error) {}

  volumeSlider.value = volume;
  updateVolume();
}

function updateVolume() {
  const volume = Number(volumeSlider.value);

  volumeValue.textContent = volume + "%";

  try {
    localStorage.setItem("gh_volume", volume);
  } catch (error) {}

  if (masterGain && audioContext) {
    masterGain.gain.setTargetAtTime(
      volume / 100 * 0.12,
      audioContext.currentTime,
      0.05
    );
  }
}

volumeSlider.addEventListener("input", updateVolume);

/* HORROR AMBIENCE
   Audio starts after the player interacts with the page. */

function startHorrorAudio() {
  if (audioStarted) {
    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
    return;
  }

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  try {
    audioContext = new AudioContextClass();
    masterGain = audioContext.createGain();

    const volume = Number(volumeSlider.value) / 100;
    masterGain.gain.value = volume * 0.12;
    masterGain.connect(audioContext.destination);

    const osc1 = audioContext.createOscillator();
    const osc2 = audioContext.createOscillator();
    const gain1 = audioContext.createGain();
    const gain2 = audioContext.createGain();

    osc1.type = "sine";
    osc2.type = "triangle";

    osc1.frequency.value = 48;
    osc2.frequency.value = 51;

    gain1.gain.value = 0.65;
    gain2.gain.value = 0.2;

    osc1.connect(gain1);
    osc2.connect(gain2);

    gain1.connect(masterGain);
    gain2.connect(masterGain);

    osc1.start();
    osc2.start();

    const lfo = audioContext.createOscillator();
    const lfoGain = audioContext.createGain();

    lfo.frequency.value = 0.12;
    lfoGain.gain.value = 8;

    lfo.connect(lfoGain);
    lfoGain.connect(osc2.frequency);
    lfo.start();

    audioStarted = true;

    audioContext.resume().catch(() => {});
  } catch (error) {
    console.warn("Audio could not start:", error);
  }
}

document.addEventListener("pointerdown", startHorrorAudio, {
  once: true
});

document.addEventListener("keydown", startHorrorAudio, {
  once: true
});

/* MENU BUTTONS */

$("play").addEventListener("click", () => {
  startHorrorAudio();
  openPanel("modePanel");
});

$("settingsButton").addEventListener("click", () => {
  startHorrorAudio();
  openPanel("settingsPanel");
});

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closePanel(button.dataset.close);
  });
});

/* START GAME */

function startGame(mode) {
  try {
    sessionStorage.setItem("gh_mode", mode);
    sessionStorage.setItem("gh_menu", "1");
  } catch (error) {}

  closeAllPanels();
  $("loading").classList.add("open");

  /*
    The game file must be named index.html
    and be in the same folder as this menu file.
  */
  window.location.href = "index.html";
}

$("normalButton").addEventListener("click", () => {
  startGame("normal");
});

$("nightmareButton").addEventListener("click", () => {
  openPanel("warningPanel");
});

$("continueNightmare").addEventListener("click", () => {
  startGame("nightmare");
});

/* LANGUAGE BUTTON */

$("language").addEventListener("click", () => {
  currentLanguage = currentLanguage === "en" ? "vi" : "en";

  if (currentLanguage === "vi") {
    $("play").textContent = "CHƠI";
    $("settingsButton").textContent = "CÀI ĐẶT";
    $("normalButton").textContent = "BÌNH THƯỜNG";
    $("nightmareButton").textContent = "ÁC MỘNG";
    $("warningTitle").textContent = "CẢNH BÁO!";
    $("continueNightmare").textContent = "TIẾP TỤC";
    $("volumeValue").setAttribute("aria-label", "Âm lượng");
  } else {
    $("play").textContent = "PLAY";
    $("settingsButton").textContent = "SETTINGS";
    $("normalButton").textContent = "NORMAL";
    $("nightmareButton").textContent = "NIGHTMARE";
    $("warningTitle").textContent = "WARNING!";
    $("continueNightmare").textContent = "CONTINUE";
  }
});

/* ESCAPE KEY */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAllPanels();
  }
});

/* INITIALIZE */

loadVolume();
</script>

</body>
</html>
